<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMWAJ Portal — Premium Travel Management</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0A1118',
                            primary: '#1A2F45',
                            sand: '#F5F2EB',
                            gold: '#C5A880',
                            surface: '#FFFFFF',
                            muted: '#6B7280',
                            border: '#E5E7EB',
                            error: '#DC2626',
                            success: '#059669',
                            warning: '#D97706',
                            info: '#2563EB'
                        }
                    },
                    boxShadow: {
                        'premium': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'premium-hover': '0 20px 40px -10px rgba(0,0,0,0.12)',
                        'modal': '0 25px 50px -12px rgba(0,0,0,0.25)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: theme('colors.gray.50');
            color: theme('colors.brand.dark');
            -webkit-font-smoothing: antialiased;
        }
        
        .dark body {
            background-color: theme('colors.brand.dark');
            color: theme('colors.brand.sand');
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: theme('colors.brand.border'); border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: theme('colors.gray.700'); }
        ::-webkit-scrollbar-thumb:hover { background: theme('colors.brand.gold'); }

        /* Loader */
        .spinner {
            border: 3px solid rgba(197, 168, 128, 0.3);
            border-radius: 50%;
            border-top: 3px solid theme('colors.brand.gold');
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 300ms, transform 300ms cubic-bezier(0.16, 1, 0.3, 1); }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.95); transition: opacity 200ms, transform 200ms ease-in; }

        /* Toast Animations */
        .toast-enter { opacity: 0; transform: translateX(100%); }
        .toast-enter-active { opacity: 1; transform: translateX(0); transition: all 300ms cubic-bezier(0.16, 1, 0.3, 1); }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Hide elements dynamically */
        .hidden { display: none !important; }
        
        /* Print styles */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="selection:bg-brand-gold selection:text-white transition-colors duration-300">

    <!-- App Mount Point -->
    <div id="app" class="min-h-screen flex w-full"></div>

    <!-- Global Components (Modals, Toasts) -->
    <div id="modal-root" class="relative z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-brand-dark/60 backdrop-blur-sm transition-opacity" id="modal-backdrop"></div>
        <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <div id="modal-content" class="relative transform overflow-hidden rounded-2xl bg-white dark:bg-gray-900 text-left shadow-modal transition-all sm:my-8 sm:w-full sm:max-w-2xl border border-brand-border dark:border-gray-800">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>
    </div>

    <div id="toast-root" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <script>
        const Utils = {
            generateId: (prefix) => `${prefix}-${Math.random().toString(36).substring(2, 8).toUpperCase()}`,
            formatDate: (dateStr) => {
                if (!dateStr) return 'N/A';
                return new Date(dateStr).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            },
            formatDateTime: (dateStr) => {
                if (!dateStr) return 'N/A';
                return new Date(dateStr).toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
            },
            formatCurrency: (amount) => {
                return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
            },
            escapeHTML: (str) => {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            },
            truncate: (str, length) => str && str.length > length ? str.substring(0, length) + '...' : str,
            getStatusColor: (status) => {
                const colors = {
                    'pending': 'bg-warning/10 text-warning border-warning/20',
                    'confirmed': 'bg-info/10 text-info border-info/20',
                    'payment_required': 'bg-warning/10 text-warning border-warning/20',
                    'paid': 'bg-success/10 text-success border-success/20',
                    'completed': 'bg-success/10 text-success border-success/20',
                    'cancelled': 'bg-error/10 text-error border-error/20',
                    'submitted': 'bg-info/10 text-info border-info/20',
                    'under_review': 'bg-warning/10 text-warning border-warning/20',
                    'docs_required': 'bg-error/10 text-error border-error/20',
                    'processing': 'bg-info/10 text-info border-info/20',
                    'approved': 'bg-success/10 text-success border-success/20',
                    'rejected': 'bg-error/10 text-error border-error/20',
                };
                return colors[status.toLowerCase()] || 'bg-gray-100 text-gray-700 border-gray-200';
            },
            formatStatus: (status) => status.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
            fileToBase64: (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            })
        };

        const DB = {
            get: (collection) => JSON.parse(localStorage.getItem(collection) || '[]'),
            set: (collection, data) => localStorage.setItem(collection, JSON.stringify(data)),
            insert: (collection, record) => {
                const data = DB.get(collection);
                const newRecord = { ...record, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
                data.push(newRecord);
                DB.set(collection, data);
                return newRecord;
            },
            update: (collection, id, updates) => {
                let data = DB.get(collection);
                let updatedRecord = null;
                data = data.map(item => {
                    if (item.id === id) {
                        updatedRecord = { ...item, ...updates, updatedAt: new Date().toISOString() };
                        return updatedRecord;
                    }
                    return item;
                });
                DB.set(collection, data);
                return updatedRecord;
            },
            remove: (collection, id) => {
                const data = DB.get(collection).filter(item => item.id !== id);
                DB.set(collection, data);
            },
            findOne: (collection, queryFn) => DB.get(collection).find(queryFn),
            findMany: (collection, queryFn) => DB.get(collection).filter(queryFn),
            clear: () => localStorage.clear()
        };

        const SeedData = () => {
            if (!localStorage.getItem('amwaj_seeded')) {
                DB.clear();
                
                // Seed Admin
                DB.insert('amwaj_users', {
                    id: 'USR-ADMIN', name: 'AMWAJ Admin', email: 'malamgiemou00@gmail.com', 
                    password: btoa('Aliyoux@1'), role: 'admin', country: 'Nigeria', phone: '+234000000000'
                });

                // Seed Demo Customer
                DB.insert('amwaj_users', {
                    id: 'USR-DEMO', name: 'Demo Customer', email: 'demo@example.com', 
                    password: btoa('demo123'), role: 'customer', country: 'Nigeria', phone: '+234111111111'
                });

                // Seed Properties
                const properties = [
                    { id: 'PROP-1', name: 'The Nile Executive Suite', country: 'Egypt', city: 'Cairo', type: 'Apartment', bedrooms: 2, bathrooms: 2, guests: 4, price: 120, amenities: ['WiFi', 'Kitchen', 'Nile View', 'AC'], image: 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?q=80&w=800&auto=format&fit=crop', verified: true, featured: true, description: 'Premium suite overlooking the Nile. Perfect for business and medical travelers.' },
                    { id: 'PROP-2', name: 'Riyadh Diplomatic Villa', country: 'Saudi Arabia', city: 'Riyadh', type: 'Villa', bedrooms: 4, bathrooms: 4, guests: 8, price: 350, amenities: ['Pool', 'Security', 'Parking', 'WiFi'], image: 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=800&auto=format&fit=crop', verified: true, featured: true, description: 'Spacious secure villa in the Diplomatic Quarter.' },
                    { id: 'PROP-3', name: 'Giza Pyramids View Loft', country: 'Egypt', city: 'Giza', type: 'Loft', bedrooms: 1, bathrooms: 1, guests: 2, price: 85, amenities: ['Pyramid View', 'Balcony', 'AC'], image: 'https://images.unsplash.com/photo-1502672260266-1c1c24240f57?q=80&w=800&auto=format&fit=crop', verified: true, featured: false, description: 'Wake up to the Pyramids.' },
                    { id: 'PROP-4', name: 'Jeddah Seafront Studio', country: 'Saudi Arabia', city: 'Jeddah', type: 'Studio', bedrooms: 1, bathrooms: 1, guests: 2, price: 110, amenities: ['Sea View', 'Gym', 'WiFi'], image: 'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?q=80&w=800&auto=format&fit=crop', verified: false, featured: false, description: 'Modern studio near the Corniche.' },
                    { id: 'PROP-5', name: 'New Cairo Family Home', country: 'Egypt', city: 'New Cairo', type: 'Apartment', bedrooms: 3, bathrooms: 2, guests: 6, price: 150, amenities: ['Kitchen', 'Parking', 'Security'], image: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=800&auto=format&fit=crop', verified: true, featured: false, description: 'Spacious family apartment in a quiet gated community.' }
                ];
                properties.forEach(p => DB.insert('amwaj_properties', p));

                // Seed Bookings
                DB.insert('amwaj_bookings', {
                    id: 'AMW-BKG-1001', userId: 'USR-DEMO', propertyId: 'PROP-1', checkIn: '2026-09-01', checkOut: '2026-09-10', guests: 2, purpose: 'Tourism', status: 'confirmed', paymentStatus: 'payment_required', totalAmount: 1080
                });

                localStorage.setItem('amwaj_seeded', 'true');
            }
        };

        const UI = {
            showToast: (message, type = 'info') => {
                const toastRoot = document.getElementById('toast-root');
                const toast = document.createElement('div');
                
                const styles = {
                    success: 'bg-white border-l-4 border-success text-brand-dark',
                    error: 'bg-white border-l-4 border-error text-brand-dark',
                    info: 'bg-white border-l-4 border-info text-brand-dark',
                    warning: 'bg-white border-l-4 border-warning text-brand-dark'
                };
                
                const icons = {
                    success: '<i data-lucide="check-circle" class="w-5 h-5 text-success"></i>',
                    error: '<i data-lucide="x-circle" class="w-5 h-5 text-error"></i>',
                    info: '<i data-lucide="info" class="w-5 h-5 text-info"></i>',
                    warning: '<i data-lucide="alert-triangle" class="w-5 h-5 text-warning"></i>'
                };

                toast.className = `${styles[type]} shadow-lg rounded-lg p-4 flex items-start gap-3 transform transition-all duration-300 pointer-events-auto`;
                toast.innerHTML = `
                    <div class="mt-0.5">${icons[type]}</div>
                    <div class="flex-1 text-sm font-medium">${Utils.escapeHTML(message)}</div>
                    <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-4 h-4"></i></button>
                `;
                
                toastRoot.appendChild(toast);
                lucide.createIcons({root: toast});
                
                // Animation in
                requestAnimationFrame(() => {
                    toast.classList.add('translate-x-0', 'opacity-100');
                });

                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-x-full');
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            },
            openModal: (title, contentHTML) => {
                document.getElementById('modal-root').classList.remove('hidden');
                document.getElementById('modal-content').innerHTML = `
                    <div class="px-6 py-4 border-b border-brand-border dark:border-gray-800 flex justify-between items-center bg-gray-50 dark:bg-gray-800">
                        <h3 class="text-lg font-serif font-medium" id="modal-title">${title}</h3>
                        <button onclick="UI.closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-white transition-colors">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="px-6 py-6 max-h-[75vh] overflow-y-auto">
                        ${contentHTML}
                    </div>
                `;
                lucide.createIcons({root: document.getElementById('modal-content')});
                
                // Enter animation
                const content = document.getElementById('modal-content');
                content.className = "relative transform overflow-hidden rounded-2xl bg-white dark:bg-gray-900 text-left shadow-modal sm:my-8 sm:w-full sm:max-w-2xl border border-brand-border dark:border-gray-800 modal-enter";
                requestAnimationFrame(() => content.classList.add('modal-enter-active'));
            },
            closeModal: () => {
                const content = document.getElementById('modal-content');
                content.classList.remove('modal-enter', 'modal-enter-active');
                content.classList.add('modal-exit-active');
                setTimeout(() => {
                    document.getElementById('modal-root').classList.add('hidden');
                }, 200);
            },
            createLog: (userId, action, details) => {
                DB.insert('amwaj_activity_log', { userId, action, details });
            },
            createNotification: (userId, title, message, type='info') => {
                DB.insert('amwaj_notifications', { userId, title, message, type, read: false });
            }
        };

        const Auth = {
            getCurrentUser: () => {
                const session = DB.get('amwaj_sessions')[0];
                if (!session) return null;
                return DB.findOne('amwaj_users', u => u.id === session.userId);
            },
            login: (email, password) => {
                const user = DB.findOne('amwaj_users', u => u.email === email && u.password === btoa(password));
                if (!user) throw new Error("Invalid credentials");
                
                DB.set('amwaj_sessions', [{ id: Utils.generateId('SESS'), userId: user.id, role: user.role, createdAt: new Date().toISOString() }]);
                UI.createLog(user.id, 'Login', 'User logged in successfully');
                return user;
            },
            signup: (data) => {
                if (DB.findOne('amwaj_users', u => u.email === data.email)) throw new Error("Email already registered");
                if (data.password !== data.confirmPassword) throw new Error("Passwords do not match");
                
                const user = DB.insert('amwaj_users', {
                    id: Utils.generateId('USR'),
                    name: `${data.firstName} ${data.lastName}`,
                    email: data.email,
                    phone: data.phone,
                    country: data.country,
                    password: btoa(data.password),
                    role: 'customer'
                });
                
                DB.set('amwaj_sessions', [{ id: Utils.generateId('SESS'), userId: user.id, role: user.role, createdAt: new Date().toISOString() }]);
                UI.createLog(user.id, 'Signup', 'New customer account created');
                UI.createNotification(user.id, 'Welcome to AMWAJ', 'Your journey begins with confidence. Explore our stays and services.');
                return user;
            },
            logout: () => {
                const user = Auth.getCurrentUser();
                if (user) UI.createLog(user.id, 'Logout', 'User logged out');
                DB.set('amwaj_sessions', []);
                window.location.hash = '#/auth';
            }
        };

        window.AppActions = {
            // Auth Actions
            handleLogin: (e) => {
                e.preventDefault();
                const form = e.target;
                const btn = form.querySelector('button[type="submit"]');
                btn.innerHTML = '<div class="spinner border-t-white mx-auto"></div>';
                
                setTimeout(() => {
                    try {
                        const user = Auth.login(form.email.value, form.password.value);
                        UI.showToast(`Welcome back, ${user.name}`, 'success');
                        window.location.hash = user.role === 'admin' ? '#/admin' : '#/dashboard';
                    } catch (err) {
                        UI.showToast(err.message, 'error');
                        btn.innerHTML = 'Sign In';
                    }
                }, 800); // Simulate network
            },
            handleSignup: (e) => {
                e.preventDefault();
                const form = e.target;
                const btn = form.querySelector('button[type="submit"]');
                btn.innerHTML = '<div class="spinner border-t-white mx-auto"></div>';
                
                setTimeout(() => {
                    try {
                        const data = Object.fromEntries(new FormData(form));
                        const user = Auth.signup(data);
                        UI.showToast('Account created successfully', 'success');
                        window.location.hash = '#/dashboard';
                    } catch (err) {
                        UI.showToast(err.message, 'error');
                        btn.innerHTML = 'Create Account';
                    }
                }, 800);
            },
            toggleAuthView: (view) => {
                document.getElementById('auth-login').classList.toggle('hidden', view !== 'login');
                document.getElementById('auth-signup').classList.toggle('hidden', view !== 'signup');
            },
            
            // App Shell Actions
            toggleSidebar: () => {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('-translate-x-full');
            },
            toggleTheme: () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('amwaj_theme', isDark ? 'dark' : 'light');
            },

            // Customer Actions
            saveProperty: (propId) => {
                const user = Auth.getCurrentUser();
                const existing = DB.findOne('amwaj_saved_properties', s => s.userId === user.id && s.propertyId === propId);
                if (existing) {
                    DB.remove('amwaj_saved_properties', existing.id);
                    UI.showToast('Removed from saved stays');
                } else {
                    DB.insert('amwaj_saved_properties', { id: Utils.generateId('SAV'), userId: user.id, propertyId: propId });
                    UI.showToast('Property saved successfully', 'success');
                }
                Router.navigate(); // Refresh view
            },
            openBookingModal: (propId) => {
                const prop = DB.findOne('amwaj_properties', p => p.id === propId);
                const html = `
                    <form onsubmit="AppActions.submitBooking(event, '${propId}')" class="space-y-4">
                        <div class="mb-4 pb-4 border-b border-brand-border dark:border-gray-700">
                            <h4 class="font-serif text-xl">${Utils.escapeHTML(prop.name)}</h4>
                            <p class="text-sm text-brand-muted">${prop.location || prop.city}, ${prop.country}</p>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm font-medium mb-1">Check-in</label><input type="date" name="checkIn" required class="w-full p-2 border rounded-lg dark:bg-gray-800 dark:border-gray-700"></div>
                            <div><label class="block text-sm font-medium mb-1">Check-out</label><input type="date" name="checkOut" required class="w-full p-2 border rounded-lg dark:bg-gray-800 dark:border-gray-700"></div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm font-medium mb-1">Guests</label><input type="number" name="guests" min="1" max="${prop.guests}" required class="w-full p-2 border rounded-lg dark:bg-gray-800 dark:border-gray-700"></div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Purpose</label>
                                <select name="purpose" required class="w-full p-2 border rounded-lg dark:bg-gray-800 dark:border-gray-700">
                                    <option value="Tourism">Tourism</option>
                                    <option value="Medical">Medical</option>
                                    <option value="Study">Study</option>
                                    <option value="Business">Business</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div><label class="block text-sm font-medium mb-1">Special Requests</label><textarea name="notes" rows="3" class="w-full p-2 border rounded-lg dark:bg-gray-800 dark:border-gray-700"></textarea></div>
                        <div class="flex justify-end gap-3 pt-4">
                            <button type="button" onclick="UI.closeModal()" class="px-4 py-2 text-brand-muted hover:text-brand-dark dark:hover:text-white">Cancel</button>
                            <button type="submit" class="bg-brand-primary text-white px-6 py-2 rounded-lg hover:bg-brand-dark transition-colors">Request Booking</button>
                        </div>
                    </form>
                `;
                UI.openModal('Request Booking', html);
            },
            submitBooking: (e, propId) => {
                e.preventDefault();
                const form = e.target;
                const user = Auth.getCurrentUser();
                const prop = DB.findOne('amwaj_properties', p => p.id === propId);
                
                // Calculate rough price based on days
                const d1 = new Date(form.checkIn.value);
                const d2 = new Date(form.checkOut.value);
                const diffTime = Math.abs(d2 - d1);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                const amount = diffDays > 0 ? diffDays * prop.price : prop.price;

                const bkg = DB.insert('amwaj_bookings', {
                    id: Utils.generateId('AMW-BKG'),
                    userId: user.id,
                    propertyId: propId,
                    checkIn: form.checkIn.value,
                    checkOut: form.checkOut.value,
                    guests: form.guests.value,
                    purpose: form.purpose.value,
                    notes: form.notes.value,
                    status: 'pending',
                    paymentStatus: 'pending',
                    totalAmount: amount
                });

                UI.createLog(user.id, 'Booking Requested', `Requested ${bkg.id} for ${prop.name}`);
                UI.createNotification(user.id, 'Booking Requested', `Your request for ${prop.name} has been received and is pending review.`);
                // Notify admin pseudo
                UI.createNotification('USR-ADMIN', 'New Booking Request', `Customer requested ${bkg.id}`);
                
                UI.closeModal();
                UI.showToast('Booking request submitted successfully', 'success');
                window.location.hash = '#/bookings';
            },
            openPaymentModal: (bkgId) => {
                const bkg = DB.findOne('amwaj_bookings', b => b.id === bkgId);
                const html = `
                    <div class="text-center mb-6">
                        <div class="text-sm text-brand-muted uppercase tracking-wider mb-1">Prototype Payment Environment</div>
                        <div class="text-3xl font-serif text-brand-dark dark:text-white mb-2">${Utils.formatCurrency(bkg.totalAmount)}</div>
                        <p class="text-sm">For Booking: ${bkg.id}</p>
                    </div>
                    <form onsubmit="AppActions.submitPayment(event, '${bkgId}')" class="space-y-4">
                        <div class="bg-gray-50 dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 space-y-4">
                            <div><label class="block text-xs font-medium mb-1">Card Number (Simulation)</label><input type="text" value="**** **** **** 4242" disabled class="w-full p-2 bg-white dark:bg-gray-700 border rounded opacity-70"></div>
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="block text-xs font-medium mb-1">Expiry</label><input type="text" value="12/28" disabled class="w-full p-2 bg-white dark:bg-gray-700 border rounded opacity-70"></div>

                    if (passportFile.size > 2 * 1024 * 1024) throw new Error("File too large. Max 2MB.");
                    
                    const base64 = await Utils.fileToBase64(passportFile);

                            </form>
                            
                            <div class="text-center mt-6">
                                <p class="text-sm text-brand-muted">Already have an account? <button onclick="AppActions.toggleAuthView('login')" class="text-brand-gold font-medium hover:underline">Sign in</button></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        const AppShell = {
            render: (user, hash, contentHtml) => {
                const titleMap = {
                    '#/dashboard': 'Overview', '#/stays': 'Find a Stay', '#/bookings': 'My Bookings',
                    '#/visa': 'Visa Services', '#/payments': 'Payments', '#/saved': 'Saved Stays',
                    '#/admin': 'Admin Dashboard', '#/admin/bookings': 'Manage Bookings',
                    '#/admin/visa': 'Manage Visas', '#/admin/properties': 'Properties',
                    '#/admin/customers': 'Customers', '#/admin/settings': 'Settings'
                };
                const title = titleMap[hash] || 'AMWAJ Portal';

                return `
                    ${Components.renderSidebar(user, hash)}
                    <div class="flex-1 flex flex-col min-h-screen lg:ml-64 w-full transition-all duration-300 bg-gray-50 dark:bg-[#05080c]">
                        ${Components.renderHeader(user, title)}
                        <main class="flex-1 p-4 sm:p-8 w-full max-w-7xl mx-auto overflow-x-hidden">
                            ${contentHtml}
                        </main>
                    </div>
                `;
            }
        };

        const Router = {
            navigate: () => {
                const hash = window.location.hash || '#/dashboard';
                const user = Auth.getCurrentUser();
                const app = document.getElementById('app');
                
                // Theme restore
                if (localStorage.getItem('amwaj_theme') === 'dark') document.documentElement.classList.add('dark');

                // Route Guards
                if (!user && hash !== '#/auth') {
                    window.location.hash = '#/auth';
                    return;
                }
                if (user && hash === '#/auth') {
                    window.location.hash = user.role === 'admin' ? '#/admin' : '#/dashboard';
                    return;
                }
                if (user && user.role === 'admin' && !hash.startsWith('#/admin')) {
                    window.location.hash = '#/admin';
                    return;
                }
                if (user && user.role === 'customer' && hash.startsWith('#/admin')) {
                    window.location.hash = '#/dashboard';
                    return;
                }

                let content = '';

                // Render specific views
                if (!user) {
                    content = AuthScreen();
                    app.innerHTML = content;
                } else {
                    try {
                        if (user.role === 'customer') {
                            if (hash === '#/dashboard') content = CustomerViews.dashboard(user);
                            else if (hash === '#/stays') content = CustomerViews.stays(user);
                            else if (hash === '#/bookings') content = CustomerViews.bookings(user);
                            else if (hash === '#/visa') content = CustomerViews.visa(user);
                            else if (hash === '#/payments') content = CustomerViews.payments(user);
                            else if (hash === '#/saved') content = Components.renderEmptyState('Coming Soon', 'Saved functionality is being updated.', 'heart'); // Fallback if data absent, though implemented in stays
                            else content = Components.renderEmptyState('Not Found', 'The requested page does not exist.');
                        } else {
                            if (hash === '#/admin') content = AdminViews.dashboard();
                            else if (hash === '#/admin/bookings') content = AdminViews.bookings();
                            else if (hash === '#/admin/visa') content = AdminViews.visa();
                            else if (hash === '#/admin/settings') content = AdminViews.settings();
                            else content = Components.renderEmptyState('Admin Section', 'Under active development for prototype phase.', 'wrench');
                        }
                    } catch (err) {
                        console.error(err);
                        content = Components.renderEmptyState('Error', 'Something went wrong rendering this view.', 'alert-circle');
                    }
                    
                    app.innerHTML = AppShell.render(user, hash, content);
                }

                // Initialize Icons after DOM render
                lucide.createIcons({root: app});
            }
        };

        window.addEventListener('hashchange', Router.navigate);
        window.addEventListener('DOMContentLoaded', () => {
            try {
                SeedData(); // Ensure base data exists
                Router.navigate();
            } catch (err) {
                console.error("App Initialization failed:", err);
                document.getElementById('app').innerHTML = `<div class="p-12 text-center text-red-600">Failed to initialize prototype local storage. Please clear browser data and try again.</div>`;
            }
        });

    </script>
</body>
</html>
